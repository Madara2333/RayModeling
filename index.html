<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#111821">
    <title>RayModeling — наглядная оптика</title>
    <link rel="stylesheet" href="./style.css?v=83d4975f">
</head>

<body>
    <main class="app learning-mode">
        <header class="top-bar">
            <a class="brand" href="#" aria-label="RayModeling — рабочая область">
                <span class="brand__mark" aria-hidden="true">R</span>
                <span class="brand__text">
                    <strong>RayModeling</strong>
                    <small>Оптика: учебная лаборатория</small>
                </span>
            </a>

            <div class="top-bar__actions" aria-label="Действия с проектом">
                <button class="top-bar__btn editor-only" type="button" id="open-scene">Открыть</button>
                <button class="top-bar__btn editor-only" type="button" id="save-scene">Сохранить</button>
                <input type="file" id="scene-file" accept="application/json,.json" hidden>
                <label class="top-bar__scene-label" for="scene-presets">Опыт</label>
                <select class="top-bar__scene-select" id="scene-presets" aria-label="Выбрать учебный опыт">
                    <option value="focus">Фокусировка линзой</option>
                    <option value="refraction">Преломление в стекле</option>
                    <option value="reflection">Отражение от зеркала</option>
                    <option value="spectrum">Дисперсия света</option>
                    <option value="filter">Как работает фильтр</option>
                </select>
                <button class="top-bar__btn top-bar__btn--accent" type="button" id="mode-toggle">Редактор</button>
            </div>
        </header>

        <section class="editor" aria-label="Редактор оптической схемы">
            <aside class="editor__toolbar" id="toolbar" aria-label="Инструменты">
                <div class="toolbar__caption">СОЗДАТЬ</div>
                <button class="tool-btn editor__tool-btn" type="button" data-tool="source" aria-label="Источник света" title="Источник света">
                    <span class="tool-btn__icon" aria-hidden="true">✳</span>
                    <span class="tool-btn__label">Источник</span>
                </button>
                <button class="tool-btn editor__tool-btn" type="button" data-tool="shape" aria-label="Форма" title="Форма">
                    <span class="tool-btn__icon tool-btn__icon--shape" aria-hidden="true">◇</span>
                    <span class="tool-btn__label">Форма</span>
                </button>
                <button class="tool-btn editor__tool-btn" type="button" data-tool="lens" aria-label="Линза" title="Линза">
                    <span class="tool-btn__icon" aria-hidden="true">◖</span>
                    <span class="tool-btn__label">Линза</span>
                </button>
                <button class="tool-btn editor__tool-btn" type="button" data-tool="mirror" aria-label="Зеркало" title="Зеркало">
                    <span class="tool-btn__icon" aria-hidden="true">／</span>
                    <span class="tool-btn__label">Зеркало</span>
                </button>
                <button class="tool-btn editor__tool-btn" type="button" data-tool="filter" aria-label="Спектральный фильтр" title="Спектральный фильтр">
                    <span class="tool-btn__icon" aria-hidden="true">▥</span>
                    <span class="tool-btn__label">Фильтр</span>
                </button>
                <button class="tool-btn editor__tool-btn" type="button" data-tool="sensor" aria-label="Датчик света" title="Датчик света">
                    <span class="tool-btn__icon" aria-hidden="true">▤</span>
                    <span class="tool-btn__label">Датчик</span>
                </button>
                <div class="toolbar__separator" aria-hidden="true"></div>
                <button class="tool-btn editor__tool-btn" type="button" data-tool="select" aria-label="Выбор и перемещение" title="Выбор и перемещение">
                    <span class="tool-btn__icon" aria-hidden="true">↖</span>
                    <span class="tool-btn__label">Выбор</span>
                </button>
            </aside>

            <section class="editor__workspace" id="scene" aria-label="Рабочая область">
                <div class="workspace-controls" aria-label="Вид схемы">
                    <button type="button" id="zoom-out" aria-label="Уменьшить">−</button>
                    <span id="zoom-label">100%</span>
                    <button type="button" id="zoom-in" aria-label="Увеличить">+</button>
                    <button type="button" id="fit-scene">Показать всю схему</button>
                    <button type="button" id="toggle-grid" aria-pressed="true">Сетка</button>
                </div>
                <canvas id="work-canvas" aria-label="Ход лучей в оптической схеме"></canvas>
            </section>

            <aside class="editor__inspector" id="inspector" aria-label="Параметры объекта">
                <div class="inspector__heading">
                    <div>
                        <span class="inspector__eyebrow" id="panel-eyebrow">ОПЫТ ПО ФИЗИКЕ</span>
                        <h2 id="panel-title">Что происходит?</h2>
                    </div>
                    <span class="inspector__heading-mark" aria-hidden="true">⌘</span>
                </div>
                <div class="lesson-content" id="lesson-content"></div>
                <div class="inspector__content" id="inspector-content"></div>
            </aside>

            <footer class="editor__status" id="status">
                <span class="status__dot" aria-hidden="true"></span>
                <span class="status__item">Сцена · <span id="scene-name">Фокусировка линзой</span></span>
                <span class="status__hint" id="status-hint">Выбери опыт и проследи за лучом</span>
            </footer>
        </section>
    </main>

    <script type="module" src="./main.js?v=83d4975f"></script>
</body>
</html>
